org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP2: structured processor args (fixes Room schema export with spaces in the project path)
ksp.useKSP2=true

# Single source of truth for the app version. versionCode is derived from this
# in app/build.gradle.kts (major*10000 + minor*100 + patch), so a release only
# ever needs this line changed — the two can't drift apart.
source.version=2.6.0
