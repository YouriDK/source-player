name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E '^source.version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::source.version not found in gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match source.version=${{ steps.version.outputs.version }} in gradle.properties"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write signing properties
        run: |
          {
            echo "signing.store.file=$RUNNER_TEMP/release.jks"
            echo "signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "signing.key.alias=${{ secrets.KEY_ALIAS }}"
            echo "signing.key.password=${{ secrets.KEY_PASSWORD }}"
            echo "lastfm.api_key=${{ secrets.LASTFM_API_KEY }}"
            echo "lastfm.api_secret=${{ secrets.LASTFM_API_SECRET }}"
          } > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "Source-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Source-${{ steps.version.outputs.version }}
          path: Source-${{ steps.version.outputs.version }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Source-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
