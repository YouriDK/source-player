<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Source — Redesign Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; font-family: 'Geist', system-ui, sans-serif; background: #f0eee9; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="scenes/shared.jsx"></script>
<script type="text/babel" src="scenes/paper.jsx"></script>
<script type="text/babel" src="scenes/studio.jsx"></script>
<script type="text/babel" src="scenes/vinyl.jsx"></script>

<script type="text/babel" data-presets="env,react">

// ─── Tweak state — persisted ─────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentHue": 179,
  "darkMode": true
}/*EDITMODE-END*/;

function hueToAccent(h, dark) {
  // Single chroma/lightness across hues — subtle, no neon
  return dark
    ? `oklch(0.74 0.14 ${h})`
    : `oklch(0.58 0.15 ${h})`;
}

const PRESET_HUES = [
  { h: 60,  name: 'Amber' },
  { h: 30,  name: 'Rust' },
  { h: 15,  name: 'Terracotta' },
  { h: 140, name: 'Moss' },
  { h: 220, name: 'Slate blue' },
  { h: 290, name: 'Plum' },
  { h: 350, name: 'Rose' },
];

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweakOpen, setTweakOpen] = React.useState(false);

  // Tweak protocol — register listener FIRST, then announce availability
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweakOpen(true);
      else if (e.data.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setKey = (key, val) => {
    setTweaks(prev => {
      const next = { ...prev, [key]: val };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
      return next;
    });
  };

  const accent = hueToAccent(tweaks.accentHue, tweaks.darkMode);
  const dark = tweaks.darkMode;
  const props = { dark, accent };

  return (
    <>
      <DesignCanvas>
        <DCSection id="paper" title="1. Paper" subtitle="Polish pass — same IA, warm palette, editorial hierarchy, sharper type.">
          <DCArtboard id="p-home"    label="Home"    width={390} height={844}><PhoneFrame {...props}><PaperHome {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="p-library" label="Library" width={390} height={844}><PhoneFrame {...props}><PaperLibrary {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="p-player"  label="Player"  width={390} height={844}><PhoneFrame {...props}><PaperPlayer {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="p-queue"   label="Queue"   width={390} height={844}><PhoneFrame {...props}><PaperQueue {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="p-search"  label="Search"  width={390} height={844}><PhoneFrame {...props}><PaperSearch {...props} /></PhoneFrame></DCArtboard>
        </DCSection>

        <DCSection id="studio" title="2. Studio" subtitle="Strong refresh — type-first player, album art as a stamp, library as a column index.">
          <DCArtboard id="s-home"    label="Home"    width={390} height={844}><PhoneFrame {...props}><StudioHome {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="s-library" label="Library" width={390} height={844}><PhoneFrame {...props}><StudioLibrary {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="s-player"  label="Player"  width={390} height={844}><PhoneFrame {...props}><StudioPlayer {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="s-queue"   label="Queue"   width={390} height={844}><PhoneFrame {...props}><StudioQueue {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="s-search"  label="Search"  width={390} height={844}><PhoneFrame {...props}><StudioSearch {...props} /></PhoneFrame></DCArtboard>
        </DCSection>

        <DCSection id="vinyl" title="3. Vinyl" subtitle="Bold rethink — enormous italic title as the player, home as a magazine spread, queue as an LP sleeve.">
          <DCArtboard id="v-home"    label="Home"    width={390} height={844}><PhoneFrame {...props}><VinylHome {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="v-library" label="Library" width={390} height={844}><PhoneFrame {...props}><VinylLibrary {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="v-player"  label="Player"  width={390} height={844}><PhoneFrame {...props}><VinylPlayer {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="v-queue"   label="Queue"   width={390} height={844}><PhoneFrame {...props}><VinylQueue {...props} /></PhoneFrame></DCArtboard>
          <DCArtboard id="v-search"  label="Search"  width={390} height={844}><PhoneFrame {...props}><VinylSearch {...props} /></PhoneFrame></DCArtboard>
        </DCSection>
      </DesignCanvas>

      {tweakOpen && (
        <TweakPanel tweaks={tweaks} setKey={setKey} />
      )}
    </>
  );
}

function TweakPanel({ tweaks, setKey }) {
  return (
    <div style={{
      position: 'fixed', right: 20, bottom: 20, zIndex: 200,
      width: 260, padding: 18, borderRadius: 14,
      background: 'oklch(0.18 0.01 60)', color: 'oklch(0.96 0.005 80)',
      fontFamily: '"Geist", system-ui, sans-serif',
      border: '1px solid oklch(0.28 0.012 60)',
      boxShadow: '0 20px 60px -20px rgba(0,0,0,0.5)',
    }}>
      <div style={{
        fontFamily: '"Geist Mono", ui-monospace, monospace',
        fontSize: 10, letterSpacing: 1.4, textTransform: 'uppercase',
        color: 'oklch(0.6 0.012 70)', marginBottom: 14,
      }}>Tweaks</div>

      {/* Dark / light */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: 'oklch(0.78 0.01 70)', marginBottom: 8 }}>Theme</div>
        <div style={{ display: 'flex', gap: 6, padding: 3, borderRadius: 10, background: 'oklch(0.14 0.008 60)' }}>
          {[{ k: true, l: 'Dark' }, { k: false, l: 'Light' }].map(o => (
            <div key={o.l} onClick={() => setKey('darkMode', o.k)} style={{
              flex: 1, padding: '8px 0', textAlign: 'center', borderRadius: 7,
              fontSize: 12, fontWeight: 500, cursor: 'pointer',
              background: tweaks.darkMode === o.k ? 'oklch(0.96 0.005 80)' : 'transparent',
              color: tweaks.darkMode === o.k ? 'oklch(0.18 0.01 60)' : 'oklch(0.78 0.01 70)',
            }}>{o.l}</div>
          ))}
        </div>
      </div>

      {/* Accent color */}
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'oklch(0.78 0.01 70)', marginBottom: 10 }}>
          <span>Accent</span>
          <span style={{ fontFamily: '"Geist Mono", monospace', fontSize: 11, color: 'oklch(0.58 0.012 70)' }}>
            {PRESET_HUES.find(p => p.h === tweaks.accentHue)?.name || `H${tweaks.accentHue}`}
          </span>
        </div>
        <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
          {PRESET_HUES.map(p => (
            <div key={p.h} onClick={() => setKey('accentHue', p.h)} title={p.name} style={{
              width: 28, height: 28, borderRadius: 14, cursor: 'pointer',
              background: hueToAccent(p.h, tweaks.darkMode),
              border: tweaks.accentHue === p.h
                ? '2px solid oklch(0.96 0.005 80)'
                : '2px solid transparent',
              boxShadow: tweaks.accentHue === p.h ? '0 0 0 1px oklch(0.18 0.01 60)' : 'none',
              transition: 'transform .15s',
            }} />
          ))}
        </div>
        <div style={{ marginTop: 14 }}>
          <input
            type="range"
            min="0" max="360" step="1"
            value={tweaks.accentHue}
            onChange={e => setKey('accentHue', Number(e.target.value))}
            style={{
              width: '100%', height: 6, borderRadius: 3,
              background: 'linear-gradient(to right, oklch(0.65 0.14 0), oklch(0.65 0.14 60), oklch(0.65 0.14 120), oklch(0.65 0.14 180), oklch(0.65 0.14 240), oklch(0.65 0.14 300), oklch(0.65 0.14 360))',
              appearance: 'none', outline: 'none',
            }}
          />
          <div style={{ fontFamily: '"Geist Mono", monospace', fontSize: 10, color: 'oklch(0.58 0.012 70)', marginTop: 4 }}>
            Hue {tweaks.accentHue}°
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
